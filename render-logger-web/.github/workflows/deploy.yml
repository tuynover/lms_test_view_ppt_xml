name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

# Quyền hạn cấp cho GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Giới hạn 1 deployment chạy tại một thời điểm
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            render-logger-web/package-lock.json

      - name: Install dependencies & Build
        run: |
          if [ -f "package.json" ]; then
            npm ci
            npm run build
          elif [ -d "render-logger-web" ]; then
            cd render-logger-web
            npm ci
            npm run build
            mv dist ../dist
            cd ..
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
